name: update-deps

# Bump monstar to latest main, regenerate deps.nix, verify it builds, commit.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-deps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump pin and regenerate deps
        run: |
          nix flake update monstar-src
          ./update-deps.sh

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: nix build -L

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          rev=$(jq -r '.nodes["monstar-src"].locked.rev' flake.lock)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps: bump monstar to ${rev:0:12}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

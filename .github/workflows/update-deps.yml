name: update-deps

# Track monstar upstream: bump the pin, regenerate deps.nix, verify, commit.
# A cheap tip-check gates the expensive nix job, so polling often is ~free.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC (use "0 * * * *" for hourly; the check job stays cheap)
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-deps
  cancel-in-progress: false

jobs:
  # Seconds, no nix: has monstar's default branch moved past our locked rev?
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.tip.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: tip
        run: |
          locked=$(jq -r '.nodes["monstar-src"].locked.rev' flake.lock)
          upstream=$(git ls-remote https://github.com/rockorager/monstar HEAD | cut -f1)
          echo "locked=$locked  upstream=$upstream"
          [ -n "$upstream" ] || { echo "could not read upstream HEAD" >&2; exit 1; }
          if [ "$locked" = "$upstream" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump pin and regenerate deps
        run: |
          nix flake update monstar-src
          ./update-deps.sh

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: nix build -L

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          rev=$(jq -r '.nodes["monstar-src"].locked.rev' flake.lock)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps: bump monstar to ${rev:0:12}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
